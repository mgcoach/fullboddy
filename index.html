<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MG COACH · Full Body + Dieta</title>
<!-- brand-meta: mgcoach-projeto-v4.0.0 -->
<style>
  :root{
    --bg:#0a0a0a;--bg-card:#141414;--bg-row-alt:#171717;
    --orange:#ff6b1a;--orange-dim:#ff6b1a22;--orange-line:#ff6b1a55;
    --text:#f2f2f2;--text-dim:#9a9a9a;--text-faint:#6b6b6b;--border:#262626;
    --aquec:#3a86ff;--feeder:#ffd23f;--valida:#ff6b1a;
    --falha:#ff4d4d;--falha-dim:#ff4d4d1f;--falha-line:#ff4d4d55;
    --rir:#42b883;--rir-dim:#42b8831f;--rir-line:#42b88355;
    --carb:#ffd23f;--prot:#ff6b1a;--fat:#42b883;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:50px;}

  .topbar{background:linear-gradient(180deg,#111 0%,#0a0a0a 100%);border-bottom:1px solid var(--border);padding:20px 16px 14px;text-align:center;}
  .star{font-size:22px;color:var(--orange);display:block;margin-bottom:4px;text-shadow:0 0 16px var(--orange-dim);}
  .brand{font-size:11px;letter-spacing:3px;color:var(--text-dim);font-weight:600;text-transform:uppercase;}
  .brand strong{color:var(--orange);}
  h1{font-size:20px;font-weight:800;margin-top:8px;letter-spacing:-0.5px;}

  /* seletor principal TREINO / DIETA */
  .main-switch{display:flex;gap:0;background:#0a0a0a;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:60;}
  .main-btn{flex:1;background:#0a0a0a;border:none;border-bottom:3px solid transparent;color:var(--text-dim);padding:14px;font-size:14px;font-weight:800;letter-spacing:1px;cursor:pointer;transition:all .15s;}
  .main-btn.active{color:var(--orange);border-bottom-color:var(--orange);}

  /* sub-seletor (modelos / dias dieta) */
  .sub-switch{display:flex;gap:8px;justify-content:center;padding:14px 16px 4px;flex-wrap:wrap;}
  .sub-btn{background:var(--bg-card);border:1px solid var(--border);border-radius:11px;padding:10px 14px;cursor:pointer;transition:all .15s;text-align:center;min-width:96px;}
  .sub-btn.active{background:var(--orange);border-color:var(--orange);}
  .sub-btn .sb-label{font-size:13px;font-weight:800;letter-spacing:0.5px;color:var(--text);}
  .sub-btn.active .sb-label{color:#0a0a0a;}
  .sub-btn .sb-sub{font-size:9px;color:var(--text-faint);margin-top:2px;}
  .sub-btn.active .sb-sub{color:#0a0a0a;opacity:0.75;}

  .tabs{display:flex;gap:6px;padding:12px;overflow-x:auto;background:#0a0a0a;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;cursor:pointer;color:var(--text-dim);background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;letter-spacing:0.5px;white-space:nowrap;transition:all .15s;user-select:none;-webkit-user-select:none;}
  .tab.active{background:var(--orange);color:#0a0a0a;border-color:var(--orange);}
  .tab:active{transform:scale(0.96);}

  .content{padding:12px 14px 10px;}

  .intens-note{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;padding:10px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;}
  .in-item{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text-dim);}
  .pill{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;padding:3px 7px;border-radius:5px;white-space:nowrap;}
  .pill.rir{color:var(--rir);background:var(--rir-dim);border:1px solid var(--rir-line);}
  .pill.falha{color:var(--falha);background:var(--falha-dim);border:1px solid var(--falha-line);}

  .tools{display:flex;gap:8px;margin-bottom:16px;}
  .tool-btn{flex:1;background:var(--bg-card);border:1px solid var(--border);color:var(--text-dim);border-radius:8px;padding:9px;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:0.3px;}
  .tool-btn:active{border-color:var(--orange);color:var(--orange);}

  /* ===== TREINO ===== */
  .day-summary{background:var(--bg-card);border:1px solid var(--border);border-left:3px solid var(--orange);border-radius:10px;padding:14px 16px;margin-bottom:16px;}
  .day-summary .day-title{font-size:17px;font-weight:800;color:var(--orange);margin-bottom:3px;}
  .day-summary .day-musc{font-size:12px;color:var(--text-dim);line-height:1.5;}
  .day-stats{display:flex;gap:14px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
  .stat{font-size:11px;color:var(--text-faint);}
  .stat b{color:var(--text);font-size:13px;display:block;}

  .ex-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden;}
  .ex-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 10px;background:#181818;gap:8px;}
  .ex-head-l{display:flex;align-items:center;min-width:0;}
  .ex-num{color:var(--orange);font-weight:800;font-size:13px;margin-right:8px;flex:0 0 auto;}
  .ex-name{font-size:14.5px;font-weight:700;color:var(--text);}
  .ex-musc{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--orange);background:var(--orange-dim);border:1px solid var(--orange-line);border-radius:5px;padding:3px 8px;font-weight:700;white-space:nowrap;flex:0 0 auto;}
  .ex-tags{padding:0 14px 10px;background:#181818;border-bottom:1px solid var(--border);}
  .ex-rir{display:inline-block;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;padding:3px 9px;border-radius:5px;}
  .ex-rir.falha{color:var(--falha);background:var(--falha-dim);border:1px solid var(--falha-line);}
  .ex-rir.rir{color:var(--rir);background:var(--rir-dim);border:1px solid var(--rir-line);}

  .proto{padding:4px 0;}
  .proto-row{display:grid;grid-template-columns:22px 1fr 52px 56px 48px;align-items:center;padding:8px 14px;font-size:11.5px;border-bottom:1px solid #1f1f1f;}
  .proto-row:nth-child(even){background:var(--bg-row-alt);}
  .proto-row.header-row{font-size:9px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-faint);font-weight:700;background:none !important;padding:8px 14px 5px;}
  .row-dot{width:7px;height:7px;border-radius:50%;}
  .row-dot.aquec{background:var(--aquec);}
  .row-dot.feeder{background:var(--feeder);}
  .row-dot.valida{background:var(--valida);}
  .pt-tipo{color:var(--text-dim);font-weight:600;}
  .pt-tipo.is-valida{color:var(--text);font-weight:800;}
  .pt-val{text-align:center;color:var(--text);font-weight:600;}
  .pt-val.is-valida{color:var(--orange);font-weight:800;}
  .pt-val.is-rir{color:var(--text-dim);font-weight:700;font-size:10.5px;}

  .reg-divider{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--orange);font-weight:800;border-top:2px solid var(--orange-line);background:#100d0a;}
  .last-ref{padding:8px 14px 10px;background:#100d0a;font-size:11px;color:var(--text-dim);}
  .last-ref .lr-title{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--rir);font-weight:800;margin-bottom:4px;}
  .last-ref .lr-data{color:var(--text);font-weight:600;line-height:1.6;}
  .last-ref .lr-none{color:var(--text-faint);font-style:italic;}
  .lr-date{color:var(--text-faint);font-weight:500;font-size:10px;}

  .input-block{padding:10px 14px 14px;background:#100d0a;}
  .input-row{display:grid;grid-template-columns:64px 1fr 1fr;gap:8px;align-items:center;margin-bottom:9px;}
  .input-row .il{font-size:11px;font-weight:700;color:var(--text-dim);display:flex;align-items:center;gap:5px;}
  .input-row .il .vdot{width:7px;height:7px;border-radius:50%;background:var(--valida);}
  .field{display:flex;flex-direction:column;gap:2px;}
  .field label{font-size:8.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-faint);font-weight:700;}
  .field input{background:#0d0d0d;border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:14px;font-weight:700;padding:8px 10px;width:100%;text-align:center;-webkit-appearance:none;}
  .field input:focus{outline:none;border-color:var(--orange);background:#111;}
  .field input::placeholder{color:#444;font-weight:500;}
  .save-btn{width:100%;margin-top:6px;background:var(--orange);color:#0a0a0a;border:none;border-radius:9px;padding:11px;font-size:13px;font-weight:800;letter-spacing:0.5px;cursor:pointer;transition:all .15s;}
  .save-btn:active{transform:scale(0.98);}
  .save-btn.saved{background:var(--rir);}

  .hist-toggle{display:block;width:100%;background:none;border:none;border-top:1px solid var(--border);color:var(--text-dim);font-size:11px;font-weight:700;padding:10px;cursor:pointer;text-align:center;letter-spacing:0.5px;}
  .hist-toggle:active{color:var(--orange);}
  .hist-list{display:none;padding:0 14px 12px;background:#100d0a;}
  .hist-list.open{display:block;}
  .hist-item{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:7px 0;border-bottom:1px solid #1c1c1c;color:var(--text-dim);gap:8px;}
  .hist-item:last-child{border-bottom:none;}
  .hist-item .hi-date{color:var(--text-faint);font-size:10px;flex:0 0 auto;}
  .hist-item .hi-data{color:var(--text);font-weight:600;flex:1;}
  .hist-del{background:none;border:none;color:var(--falha);font-size:14px;cursor:pointer;padding:0 4px;opacity:0.6;flex:0 0 auto;}
  .hist-del:active{opacity:1;}

  /* ===== DIETA ===== */
  .diet-summary{background:var(--bg-card);border:1px solid var(--border);border-left:3px solid var(--carb);border-radius:10px;padding:14px 16px;margin-bottom:14px;}
  .diet-title{font-size:18px;font-weight:800;margin-bottom:2px;}
  .diet-tag{font-size:11px;color:var(--text-dim);margin-bottom:10px;}
  .diet-totals{display:flex;gap:10px;padding-top:10px;border-top:1px solid var(--border);flex-wrap:wrap;}
  .dt-kcal{font-size:11px;color:var(--text-faint);}
  .dt-kcal b{color:var(--orange);font-size:18px;display:block;font-weight:800;}
  .macro-strip{display:flex;gap:8px;margin-left:auto;}
  .macro{text-align:center;font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.5px;}
  .macro b{display:block;font-size:14px;font-weight:800;}
  .macro.p b{color:var(--prot);}
  .macro.c b{color:var(--carb);}
  .macro.g b{color:var(--fat);}

  .meal-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden;}
  .meal-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#181818;border-bottom:1px solid var(--border);}
  .meal-name{font-size:14.5px;font-weight:800;}
  .meal-meta{font-size:10px;color:var(--text-faint);margin-top:2px;}
  .meal-kcal{text-align:right;}
  .meal-kcal b{font-size:15px;font-weight:800;color:var(--orange);}
  .meal-kcal span{display:block;font-size:9px;color:var(--text-faint);}
  .meal-macros{display:flex;gap:10px;padding:8px 14px;background:#100d0a;border-bottom:1px solid var(--border);font-size:10px;}
  .meal-macros span{color:var(--text-dim);}
  .meal-macros b{font-weight:800;}
  .mm-p b{color:var(--prot);} .mm-c b{color:var(--carb);} .mm-g b{color:var(--fat);}

  .food-row{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 14px;border-bottom:1px solid #1c1c1c;gap:10px;}
  .food-row:last-child{border-bottom:none;}
  .food-l{min-width:0;flex:1;}
  .food-name{font-size:13px;font-weight:600;color:var(--text);}
  .food-name .sub-badge{display:inline-block;font-size:8.5px;font-weight:700;color:var(--carb);background:#ffd23f1a;border:1px solid #ffd23f44;border-radius:4px;padding:2px 6px;margin-left:6px;vertical-align:middle;cursor:pointer;-webkit-user-select:none;user-select:none;}
  .food-name .sub-badge:active{background:#ffd23f33;}
  .sub-panel{display:none;margin-top:8px;background:#0d0d0d;border:1px solid var(--border);border-radius:8px;padding:10px;}
  .sub-panel.open{display:block;}
  .sub-panel-title{font-size:9px;text-transform:uppercase;letter-spacing:0.5px;color:var(--carb);font-weight:800;margin-bottom:6px;}
  .sub-opt{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid #1a1a1a;}
  .sub-opt:last-child{border-bottom:none;}
  .sub-opt-name{font-size:12px;font-weight:600;color:var(--text);}
  .sub-opt-qtd{font-size:10px;color:var(--text-faint);margin-top:1px;}
  .sub-opt-r{text-align:right;flex:0 0 auto;}
  .sub-opt-kcal{font-size:11.5px;font-weight:700;color:var(--text);}
  .sub-opt-macros{font-size:9px;color:var(--text-faint);margin-top:1px;white-space:nowrap;}
  .food-qtd{font-size:11px;color:var(--text-faint);margin-top:2px;}
  .food-r{text-align:right;flex:0 0 auto;}
  .food-kcal{font-size:13px;font-weight:700;color:var(--text);}
  .food-macros{font-size:9.5px;color:var(--text-faint);margin-top:2px;white-space:nowrap;}

  .diet-note{font-size:11px;color:var(--text-faint);text-align:left;padding:14px;line-height:1.6;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;margin-top:6px;}
  .diet-note b{color:var(--text-dim);}

  .footnote{font-size:11px;color:var(--text-faint);text-align:center;padding:18px 24px 6px;line-height:1.6;}
  .footnote b{color:var(--text-dim);}

  @media (min-width:680px){.content{max-width:640px;margin:0 auto;}.tabs{justify-content:center;}.sub-switch{max-width:640px;margin:0 auto;}}
</style>
</head>
<body>

<div class="topbar">
  <span class="star">★</span>
  <div class="brand">MG <strong>COACH</strong></div>
  <h1>Full Body + Dieta</h1>
</div>

<div class="main-switch">
  <button class="main-btn active" id="main-treino" onclick="selecSecao('treino')">🏋️ TREINO</button>
  <button class="main-btn" id="main-dieta" onclick="selecSecao('dieta')">🥗 DIETA</button>
</div>

<div id="secao-treino">
  <div class="sub-switch" id="modelSwitch"></div>
  <div class="tabs" id="tabsTreino"></div>
  <div class="content">
    <div class="intens-note">
      <div class="in-item"><span class="pill rir">RIR 1-2</span> compostos pesados</div>
      <div class="in-item"><span class="pill falha">Falha liberada</span> isolados</div>
    </div>
    <div class="tools">
      <button class="tool-btn" onclick="exportarDados()">⬇ Exportar backup</button>
      <button class="tool-btn" onclick="importarDados()">⬆ Importar backup</button>
    </div>
    <input type="file" id="fileImport" accept=".json" style="display:none">
    <div id="painelTreino"></div>
  </div>
</div>

<div id="secao-dieta" style="display:none;">
  <div class="sub-switch" id="dietSwitch"></div>
  <div class="content">
    <div id="painelDieta"></div>
  </div>
</div>

<div class="footnote">
  <b>★ MG COACH</b> — Projeto completo: treino Full Body (5 ou 4 dias) com registro de cargas + dieta com carb cycling. Treino à tarde · alta frequência · RIR controlado.
</div>

const STORAGE_KEY = 'mgcoach_fullbody_duplo_v3';
let secaoAtiva = 'treino';
let modeloAtivo = '5dias';
let diaAtivo = 'FB1';
let dietAtivo = 'alto';

/* ===== STORAGE (treino) ===== */
function carregarRegistros(){ try{ const r=localStorage.getItem(STORAGE_KEY); return r?JSON.parse(r):{}; }catch(e){ return {}; } }
function salvarRegistros(reg){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(reg)); }catch(e){ alert('Não foi possível salvar. Evite o modo privado/anônimo.'); } }
function chaveExercicio(modelo, dia, idx){ return 'k_'+modelo+'_'+dia+'_'+idx; }
function fmtData(iso){ const d=new Date(iso); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); }

function renderUltima(key){
  const reg=carregarRegistros(); const h=reg[key];
  if(!h||h.length===0) return '<div class="lr-none">Sem registro ainda — sua primeira sessão será a referência.</div>';
  const u=h[h.length-1];
  const t=u.series.map((s,i)=>'V'+(i+1)+': <b>'+(s.carga||'—')+'</b>kg × <b>'+(s.reps||'—')+'</b>').join('  ·  ');
  return '<div class="lr-data">'+t+' <span class="lr-date">('+fmtData(u.data)+')</span></div>';
}
function renderHistorico(key){
  const reg=carregarRegistros(); const h=reg[key];
  if(!h||h.length===0) return '<div class="hist-item"><span class="hi-date">Nenhuma sessão registrada</span></div>';
  return h.slice().reverse().map((sess,ri)=>{
    const realIdx=h.length-1-ri;
    const d=sess.series.map((s,i)=>'V'+(i+1)+' '+(s.carga||'—')+'kg×'+(s.reps||'—')).join(' · ');
    return '<div class="hist-item"><span class="hi-date">'+fmtData(sess.data)+'</span><span class="hi-data">'+d+'</span><button class="hist-del" onclick="apagarSessao(\''+key+'\','+realIdx+')">×</button></div>';
  }).join('');
}
function exCard(modelo, dia, idx, ex){
  const key=chaveExercicio(modelo,dia,idx);
  const num=String(idx+1).padStart(2,'0');
  const selo=ex.falha?'<span class="ex-rir falha">Falha liberada</span>':'<span class="ex-rir rir">RIR 1-2</span>';
  const rv=ex.falha?'Falha':'RIR 1-2';
  const proto='<div class="proto">'+
    '<div class="proto-row header-row"><span></span><span>Série</span><span>Carga</span><span>Reps</span><span>Desc.</span></div>'+
    '<div class="proto-row"><span class="row-dot aquec"></span><span class="pt-tipo">Aquecimento</span><span class="pt-val">40%</span><span class="pt-val">10</span><span class="pt-val">40s</span></div>'+
    '<div class="proto-row"><span class="row-dot feeder"></span><span class="pt-tipo">Feeder 1</span><span class="pt-val">70%</span><span class="pt-val">—</span><span class="pt-val">40s</span></div>'+
    '<div class="proto-row"><span class="row-dot feeder"></span><span class="pt-tipo">Feeder 2</span><span class="pt-val">85%</span><span class="pt-val">—</span><span class="pt-val">40s</span></div>'+
    '<div class="proto-row"><span class="row-dot valida"></span><span class="pt-tipo is-valida">Válida 1</span><span class="pt-val is-valida">100%</span><span class="pt-val is-rir">'+rv+'</span><span class="pt-val is-valida">120s</span></div>'+
    '<div class="proto-row"><span class="row-dot valida"></span><span class="pt-tipo is-valida">Válida 2</span><span class="pt-val is-valida">100%</span><span class="pt-val is-rir">'+rv+'</span><span class="pt-val is-valida">120s</span></div></div>';
  const inputs=[0,1].map(i=>'<div class="input-row"><div class="il"><span class="vdot"></span>Válida '+(i+1)+'</div>'+
    '<div class="field"><label>Carga (kg)</label><input type="number" inputmode="decimal" step="0.5" id="'+key+'_c'+i+'" placeholder="0"></div>'+
    '<div class="field"><label>Reps</label><input type="number" inputmode="numeric" id="'+key+'_r'+i+'" placeholder="0"></div></div>').join('');
  return '<div class="ex-card"><div class="ex-head"><div class="ex-head-l"><span class="ex-num">'+num+'</span><span class="ex-name">'+ex.nome+'</span></div><span class="ex-musc">'+ex.musculo+'</span></div>'+
    '<div class="ex-tags">'+selo+'</div>'+proto+
    '<div class="reg-divider">✎ Registrar sessão</div>'+
    '<div class="last-ref" id="'+key+'_ref"><div class="lr-title">★ Última vez</div>'+renderUltima(key)+'</div>'+
    '<div class="input-block">'+inputs+'<button class="save-btn" id="'+key+'_btn" onclick="salvarSessao(\''+modelo+'\',\''+dia+'\','+idx+')">Salvar sessão de hoje</button></div>'+
    '<button class="hist-toggle" onclick="toggleHist(\''+key+'\')">▾ Ver histórico</button>'+
    '<div class="hist-list" id="'+key+'_hist">'+renderHistorico(key)+'</div></div>';
}
function renderPainelTreino(){
  const dias=MODELOS[modeloAtivo].dias; const exs=dias[diaAtivo];
  const m=[]; exs.forEach(e=>{ if(!m.includes(e.musculo)) m.push(e.musculo); });
  const mins=Math.round(9.2*exs.length);
  let html='<div class="day-summary"><div class="day-title">'+diaAtivo.slice(0,2)+' '+diaAtivo.slice(2)+'</div>'+
    '<div class="day-musc">'+m.join(' · ')+'</div><div class="day-stats"><div class="stat"><b>'+exs.length+'</b>exercícios</div>'+
    '<div class="stat"><b>~'+mins+'min</b>duração</div><div class="stat"><b>'+m.length+'</b>músculos</div></div></div>';
  html+=exs.map((ex,idx)=>exCard(modeloAtivo,diaAtivo,idx,ex)).join('');
  document.getElementById('painelTreino').innerHTML=html;
}
function renderTabsTreino(){
  const dias=Object.keys(MODELOS[modeloAtivo].dias);
  if(!dias.includes(diaAtivo)) diaAtivo=dias[0];
  document.getElementById('tabsTreino').innerHTML=dias.map(d=>'<div class="tab'+(d===diaAtivo?' active':'')+'" onclick="selecDia(\''+d+'\')">'+d.slice(0,2)+' '+d.slice(2)+'</div>').join('');
}
function renderSwitch(){
  document.getElementById('modelSwitch').innerHTML=Object.keys(MODELOS).map(mm=>'<div class="sub-btn'+(mm===modeloAtivo?' active':'')+'" onclick="selecModelo(\''+mm+'\')"><div class="sb-label">'+MODELOS[mm].label+'</div><div class="sb-sub">'+MODELOS[mm].sub+'</div></div>').join('');
}
function selecModelo(m){ modeloAtivo=m; renderSwitch(); renderTabsTreino(); renderPainelTreino(); window.scrollTo(0,0); }
function selecDia(d){ diaAtivo=d; renderTabsTreino(); renderPainelTreino(); }

function salvarSessao(modelo, dia, idx){
  const key=chaveExercicio(modelo,dia,idx);
  const series=[0,1].map(i=>({carga:document.getElementById(key+'_c'+i).value.trim(),reps:document.getElementById(key+'_r'+i).value.trim()}));
  if(series.every(s=>!s.carga&&!s.reps)){ alert('Preencha pelo menos uma carga ou repetição.'); return; }
  const reg=carregarRegistros(); if(!reg[key]) reg[key]=[];
  reg[key].push({data:new Date().toISOString(),series:series}); salvarRegistros(reg);
  const b=document.getElementById(key+'_btn'); b.textContent='✓ Salvo!'; b.classList.add('saved');
  setTimeout(()=>{ b.textContent='Salvar sessão de hoje'; b.classList.remove('saved'); },1500);
  document.getElementById(key+'_ref').innerHTML='<div class="lr-title">★ Última vez</div>'+renderUltima(key);
  document.getElementById(key+'_hist').innerHTML=renderHistorico(key);
  [0,1].forEach(i=>{ document.getElementById(key+'_c'+i).value=''; document.getElementById(key+'_r'+i).value=''; });
}
function apagarSessao(key, idx){
  if(!confirm('Apagar esta sessão do histórico?')) return;
  const reg=carregarRegistros();
  if(reg[key]){ reg[key].splice(idx,1); if(reg[key].length===0) delete reg[key]; salvarRegistros(reg);
    const r=document.getElementById(key+'_ref'); if(r) r.innerHTML='<div class="lr-title">★ Última vez</div>'+renderUltima(key);
    const h=document.getElementById(key+'_hist'); if(h) h.innerHTML=renderHistorico(key); }
}
function toggleHist(key){ const el=document.getElementById(key+'_hist'); el.classList.toggle('open'); el.previousElementSibling.textContent=el.classList.contains('open')?'▴ Ocultar histórico':'▾ Ver histórico'; }

function exportarDados(){
  const reg=carregarRegistros(); const blob=new Blob([JSON.stringify(reg,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='mgcoach-cargas-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); URL.revokeObjectURL(url);
}
function importarDados(){ document.getElementById('fileImport').click(); }
document.getElementById('fileImport').addEventListener('change',function(e){
  const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=function(ev){ try{ const d=JSON.parse(ev.target.result); if(confirm('Isso vai substituir os registros atuais por este backup. Continuar?')){ salvarRegistros(d); renderPainelTreino(); alert('Backup importado!'); } }catch(err){ alert('Arquivo inválido.'); } };
  rd.readAsText(f);
});

function renderDietSwitch(){
  const ordem=['alto','medio','baixo'];
  document.getElementById('dietSwitch').innerHTML=ordem.map(k=>{
    const d=DIETA.dias[k];
    return '<div class="sub-btn'+(k===dietAtivo?' active':'')+'" onclick="selecDieta(\''+k+'\')"><div class="sb-label">'+d.emoji+' '+d.label.replace('DIA ','')+'</div></div>';
  }).join('');
}
function renderPainelDieta(){
  const d=DIETA.dias[dietAtivo];
  let html='<div class="diet-summary"><div class="diet-title">'+d.emoji+' '+d.label+'</div><div class="diet-tag">'+d.tag+'</div>'+
    '<div class="diet-totals"><div class="dt-kcal"><b>'+d.kcal+'</b>kcal totais</div>'+
    '<div class="macro-strip"><div class="macro p">P<b>'+d.p+'</b></div><div class="macro c">C<b>'+d.c+'</b></div><div class="macro g">G<b>'+d.g+'</b></div></div></div></div>';
  d.refeicoes.forEach(r=>{
    html+='<div class="meal-card"><div class="meal-head"><div><div class="meal-name">'+r.emoji+' '+r.nome+'</div><div class="meal-meta">Meta: '+r.meta_kcal+' kcal ('+r.meta_pct+'%)</div></div>'+
      '<div class="meal-kcal"><b>'+r.kcal+'</b><span>kcal</span></div></div>'+
      '<div class="meal-macros"><span class="mm-p">P <b>'+r.p+'g</b></span><span class="mm-c">C <b>'+r.c+'g</b></span><span class="mm-g">G <b>'+r.g+'g</b></span></div>';
    r.itens.forEach((it,ii)=>{
      const temSub = it.subs && it.subs.length>0;
      const subId = 'sub_'+dietAtivo+'_'+r.nome.replace(/[^a-zA-Z]/g,'')+'_'+ii;
      const sub = temSub?'<span class="sub-badge" onclick="toggleSub(\''+subId+'\')">⇄ '+it.subs.length+' substituição'+(it.subs.length>1?'ões':'')+'</span>':'';
      html+='<div class="food-row"><div class="food-l"><div class="food-name">'+it.nome+sub+'</div><div class="food-qtd">'+it.qtd+'</div>';
      if(temSub){
        html+='<div class="sub-panel" id="'+subId+'"><div class="sub-panel-title">Pode trocar por:</div>';
        it.subs.forEach(s=>{
          html+='<div class="sub-opt"><div class="sub-opt-l"><div class="sub-opt-name">'+s.nome+'</div><div class="sub-opt-qtd">'+s.qtd+'</div></div>'+
            '<div class="sub-opt-r"><div class="sub-opt-kcal">'+s.kcal+' kcal</div><div class="sub-opt-macros">P'+s.p+' · C'+s.c+' · G'+s.g+'</div></div></div>';
        });
        html+='</div>';
      }
      html+='</div><div class="food-r"><div class="food-kcal">'+it.kcal+' kcal</div><div class="food-macros">P'+it.p+' · C'+it.c+' · G'+it.g+'</div></div></div>';
    });
    html+='</div>';
  });
  // nota de uso
  let nota='';
  if(dietAtivo==='alto') nota='<b>🔥 Quando usar:</b> nos 4 dias de treino. Capriche no carbo do almoço (pré-treino das 14:30) para abastecer o full body completo.';
  else if(dietAtivo==='medio') nota='<b>⚖️ Carta coringa:</b> use quando necessário — num dia de descanso com caminhada longa (zona 2), ou como transição se o Dia Baixo deixar você sem energia.';
  else nota='<b>💤 Quando usar:</b> nos 3 dias de descanso. Menos carbo aproveita a recuperação para melhorar sensibilidade à insulina e flexibilidade metabólica.';
  html+='<div class="diet-note">'+nota+'</div>';
  html+='<div class="diet-note" style="margin-top:10px;"><b>Paciente:</b> '+DIETA.paciente.nome+' · '+DIETA.paciente.idade+' · '+DIETA.paciente.peso+' · '+DIETA.paciente.altura+'<br><br><b>⚠️ Importante:</b> Plano alimentar é uma sugestão personalizada. Em caso de reação adversa ou desconforto, interrompa e consulte seu profissional. Quantidades ajustáveis conforme rotina, treinos e evolução. <b>NUTRI.FUEL</b></div>';
  document.getElementById('painelDieta').innerHTML=html;
}
function selecDieta(k){ dietAtivo=k; renderDietSwitch(); renderPainelDieta(); }
function toggleSub(id){ const el=document.getElementById(id); if(el) el.classList.toggle('open'); }

/* ===== SEÇÕES ===== */
function selecSecao(s){
  secaoAtiva=s;
  document.getElementById('main-treino').classList.toggle('active', s==='treino');
  document.getElementById('main-dieta').classList.toggle('active', s==='dieta');
  document.getElementById('secao-treino').style.display = s==='treino'?'block':'none';
  document.getElementById('secao-dieta').style.display = s==='dieta'?'block':'none';
  window.scrollTo(0,0);
}

/* init */
renderSwitch(); renderTabsTreino(); renderPainelTreino();
renderDietSwitch(); renderPainelDieta();
</script>
</body>
