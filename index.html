    + '<div class="block"><h3>Semana</h3><p style="margin-bottom:10px">Escolha o que você treina em cada dia.</p>'
    + plano.semana.map((d,i) =>
        '<div class="dia-row"><span class="dia-n">'+d.dia+'</span>'
        + '<select onchange="setDia('+i+',this.value)" aria-label="Sessão de '+d.dia+'">'+opts(d.sessao)+'</select></div>').join('')
    + '</div>';

  h += '<div class="block"><h3>Sessões</h3>'
    + (nomes.length ? nomes.map(n =>
        '<div class="sess-row"><div class="sess-i"><b>'+esc(n)+'</b>'
        + '<span>'+plano.sessoes[n].exs.length+' exercícios · ~'+duracao(plano.sessoes[n].exs)+' min</span></div>'
        + '<div class="sess-b"><button onclick="editarSessao(\''+esc(n)+'\')">Editar</button>'
        + '<button onclick="apagarSessao(\''+esc(n)+'\')" aria-label="Apagar '+esc(n)+'">Apagar</button></div></div>').join('')
      : '<p>Nenhuma sessão. Crie a primeira abaixo.</p>')
    + '<button class="save" style="margin-top:12px" onclick="novaSessao()">Criar sessão</button></div>';

  h += '<div class="block"><h3>Voltar ao original</h3>'
    + '<p>Restaura a divisão PPL 2× como foi entregue. Suas cargas registradas não são apagadas.</p>'
    + '<div class="tools" style="margin-top:12px"><button onclick="restaurar()">Restaurar plano original</button></div></div>'
    + '</div>';
  document.getElementById('viewEditor').innerHTML = h;
}

function setDia(i, nome){ plano.semana[i].sessao = nome || null; gravarPlano(); renderEditor(); }

function novaSessao(){
  const n = (prompt('Nome da sessão (ex: Push 1, Treino A, Peito e tríceps)') || '').trim();
  if(!n) return;
  if(plano.sessoes[n]){ alert('Já existe uma sessão com esse nome.'); return; }
  plano.sessoes[n] = {dia:'', foco:'', exs:[]};
  gravarPlano(); editarSessao(n);
}
function apagarSessao(n){
  if(!confirm('Apagar a sessão "'+n+'"? As cargas dos exercícios continuam salvas.')) return;
  delete plano.sessoes[n];
  plano.semana.forEach(d => { if(d.sessao === n) d.sessao = null; });
  if(atual === n) atual = nomesSessoes()[0] || '';
  gravarPlano(); renderEditor();
}
function restaurar(){
  if(!confirm('Restaurar a divisão PPL 2× original? Suas cargas registradas não são apagadas.')) return;
  plano = fabrica(); gravarPlano(); editando = null;
  atual = nomesSessoes()[0];
  abrir('treino');
}

/* ----- editar uma sessão ----- */
function editarSessao(n){ editando = n; buscaEx = ''; verTodos = false; abrir('editor'); }

function renderEditSessao(){
  const n = editando, s = plano.sessoes[n];
  if(!s){ editando = null; return renderEditor(); }
  let h = '<div class="sheet">'
    + '<button class="voltar" onclick="editando=null;renderEditor()">Voltar</button>'
    + '<h2>'+esc(n)+'</h2>'
    + '<div class="block"><h3>Identificação</h3>'
    + '<label class="campo">Nome<input id="ed-nome" value="'+esc(n)+'" onchange="renomear(this.value)"></label>'
    + '<label class="campo">Descrição<input id="ed-foco" value="'+esc(s.foco||'')+'" placeholder="ex: Peito, ombro e tríceps" onchange="setFoco(this.value)"></label>'
    + '</div>';

  h += '<div class="block"><h3>Exercícios</h3>'
    + (s.exs.length ? s.exs.map((e,i) =>
        '<div class="ed-ex"><div class="ed-top"><span class="ed-n">'+(i+1)+'</span>'
        + '<span class="ed-nome">'+esc(e.nome)+'</span>'
        + '<div class="ed-mv">'
        + '<button onclick="mover('+i+',-1)" '+(i===0?'disabled':'')+' aria-label="Subir">↑</button>'
        + '<button onclick="mover('+i+',1)" '+(i===s.exs.length-1?'disabled':'')+' aria-label="Descer">↓</button>'
        + '<button onclick="removerEx('+i+')" aria-label="Remover">×</button></div></div>'
        + '<div class="ed-fmt">'
        + Object.keys(D.formatos).map(k =>
            '<button class="'+(k===e.fmt?'on':'')+'" onclick="setFmtPadrao('+i+',\''+k+'\')">'+esc(D.formatos[k].nome)+'</button>').join('')
        + '</div></div>').join('')
      : '<p>Nenhum exercício ainda.</p>')
    + '</div>';

  const termo = buscaEx.trim().toLowerCase();
  const usados = new Set(s.exs.map(e => e.id));
  const lista = D.catalogo.filter(c => !usados.has(c.id) && (!termo || c.nome.toLowerCase().includes(termo)));
  const existe = D.catalogo.some(c => c.nome.toLowerCase() === termo);
  h += '<div class="block"><h3>Adicionar exercício</h3>'
    + '<input class="busca" id="ed-busca" value="'+esc(buscaEx)+'" placeholder="Buscar ou digitar um novo" oninput="buscaEx=this.value;filtrarCat()">'
    + '<div id="ed-cat">' + renderCat(lista, termo, existe) + '</div></div>';

  h += '<div class="tools"><button onclick="editando=null;renderEditor()">Concluir</button></div></div>';
  document.getElementById('viewEditor').innerHTML = h;
  const campo = document.getElementById('ed-busca');
  if(campo && buscaEx){ campo.focus(); campo.setSelectionRange(buscaEx.length, buscaEx.length); }
}
let verTodos = false;
function renderCat(lista, termo, existe){
  let h = '';
  if(termo && !existe) h += '<button class="cat-novo" onclick="addEx(null)">Criar “'+esc(buscaEx.trim())+'”</button>';
  const corta = !termo && !verTodos && lista.length > 12;
  const mostra = corta ? lista.slice(0,12) : lista;
  h += '<div class="cat">' + (mostra.length
      ? mostra.map(c => '<button onclick="addEx(\''+c.id+'\')">'+esc(c.nome)+'</button>').join('')
      : '<p style="font-size:13px;color:var(--ink-3)">Nada encontrado. Digite o nome para criar.</p>') + '</div>';
  if(corta) h += '<button class="cat-mais" onclick="verTodos=true;filtrarCat()">Ver os outros '+(lista.length-12)+'</button>';
  return h;
}
function filtrarCat(){
  const s = plano.sessoes[editando];
  const termo = buscaEx.trim().toLowerCase();
  const usados = new Set(s.exs.map(e => e.id));
  const lista = D.catalogo.filter(c => !usados.has(c.id) && (!termo || c.nome.toLowerCase().includes(termo)));
  const existe = D.catalogo.some(c => c.nome.toLowerCase() === termo);
  document.getElementById('ed-cat').innerHTML = renderCat(lista, termo, existe);
}
function addEx(id){
  const s = plano.sessoes[editando];
  let nome, exId;
  if(id){ const c = D.catalogo.find(x => x.id === id); nome = c.nome; exId = c.id; }
  else {
    nome = buscaEx.trim(); if(!nome) return;
    exId = slugify(nome);
    if(!D.catalogo.some(c => c.id === exId)) D.catalogo.push({id:exId, nome:nome});
  }
  if(s.exs.some(e => e.id === exId)){ alert('Este exercício já está na sessão.'); return; }
  s.exs.push({nome:nome, id:exId, fmt:'reta3', nota:''});
  buscaEx = ''; gravarPlano(); renderEditSessao();
}
function removerEx(i){
  const s = plano.sessoes[editando];
  if(!confirm('Remover "'+s.exs[i].nome+'" desta sessão? As cargas registradas continuam salvas.')) return;
  s.exs.splice(i,1); gravarPlano(); renderEditSessao();
}
function mover(i, d){
  const s = plano.sessoes[editando], j = i + d;
  if(j < 0 || j >= s.exs.length) return;
  const t = s.exs[i]; s.exs[i] = s.exs[j]; s.exs[j] = t;
  gravarPlano(); renderEditSessao();
}
function setFmtPadrao(i, f){
  const s = plano.sessoes[editando];
  s.exs[i].fmt = f;
  delete formatos[s.exs[i].id];      // o padrão novo passa a valer
  gravarFmt(formatos); gravarPlano(); renderEditSessao();
}
function setFoco(v){ plano.sessoes[editando].foco = v.trim(); gravarPlano(); }
function renomear(novo){
  novo = (novo||'').trim();
  if(!novo || novo === editando) return;
  if(plano.sessoes[novo]){ alert('Já existe uma sessão com esse nome.'); renderEditSessao(); return; }
  const ordem = nomesSessoes();
  const refeito = {};
  ordem.forEach(k => { refeito[k === editando ? novo : k] = plano.sessoes[k]; });
  plano.sessoes = refeito;
  plano.semana.forEach(d => { if(d.sessao === editando) d.sessao = novo; });
  if(atual === editando) atual = novo;
  editando = novo; gravarPlano(); renderEditSessao();
}

/* ---------- dieta ---------- */
function lerEscolhas(){ try{ const r = localStorage.getItem(KEY_D); return r ? JSON.parse(r) : {}; }catch(e){ return {}; } }
function gravarEscolhas(o){ try{ localStorage.setItem(KEY_D, JSON.stringify(o)); }catch(e){} }
function somaRef(r, idx){
  const t = {k:0,p:0,c:0,g:0};
  r.fixos.concat([r.trocas[idx]]).forEach(i => { t.k+=i.k; t.p+=i.p; t.c+=i.c; t.g+=i.g; });
  return t;
}
function totalDia(){
  const t = {k:0,p:0,c:0,g:0};
  DIETA.refeicoes.forEach(r => { const s = somaRef(r, escolhas[r.id] || 0); t.k+=s.k; t.p+=s.p; t.c+=s.c; t.g+=s.g; });
  return t;
}
function atualizarTotal(){
  const t = totalDia(), a = DIETA.alvo, dif = Math.round(t.k - a.k);
  document.getElementById('hojeK').textContent = Math.round(t.k) + ' kcal';
  document.getElementById('hojeM').textContent =
    'P ' + Math.round(t.p) + ' g · C ' + Math.round(t.c) + ' g · G ' + Math.round(t.g) + ' g'
    + (Math.abs(dif) >= 45 ? '  (' + (dif>0?'+':'') + dif + ' do alvo)' : '');
}
function escolher(id, idx){
  escolhas[id] = idx; gravarEscolhas(escolhas);
  const r = DIETA.refeicoes.find(x => x.id === id);
  document.querySelectorAll('[data-opt="'+id+'"]').forEach((b,i) => b.classList.toggle('on', i===idx));
  const s = somaRef(r, idx), o = r.trocas[idx];
  document.getElementById('k_'+id).innerHTML = Math.round(s.k) + '<span>kcal</span>';
  document.getElementById('m_'+id).innerHTML = 'P <b>' + Math.round(s.p) + ' g</b> · C <b>' + Math.round(s.c) + ' g</b> · G <b>' + Math.round(s.g) + ' g</b>';
  document.getElementById('d_'+id).innerHTML = '<b>' + esc(o.nome) + '</b> — ' + esc(o.qtd);
  atualizarTotal();
}
function renderDieta(){
  escolhas = lerEscolhas();
  const a = DIETA.alvo;
  let h = '<section class="alvo"><h2>' + a.k + ' kcal</h2>'
    + '<p class="sub">' + esc(DIETA.logica) + '</p>'
    + '<div class="macros">'
    + '<div class="macro"><span class="mv">' + a.p + ' g</span><span class="ml">proteína</span><span class="mg">' + esc(a.regra_p) + '</span></div>'
    + '<div class="macro"><span class="mv">' + a.c + ' g</span><span class="ml">carboidrato</span><span class="mg">o que sobra</span></div>'
    + '<div class="macro"><span class="mv">' + a.g + ' g</span><span class="ml">gordura</span><span class="mg">' + esc(a.regra_g) + '</span></div>'
    + '</div></section>';
  h += '<div class="hoje"><span class="hl">Seu dia</span><div class="hv" id="hojeK">—</div><div class="hm" id="hojeM"></div></div>';
  DIETA.refeicoes.forEach(r => {
    const idx = escolhas[r.id] || 0;
    const s = somaRef(r, idx), o = r.trocas[idx];
    h += '<article class="ref">'
      + '<div class="ref-top"><div><h3 class="ref-nome">' + esc(r.nome) + '</h3>'
      + '<div class="ref-quando">' + esc(r.quando) + '</div></div>'
      + '<div class="ref-k" id="k_' + r.id + '">' + Math.round(s.k) + '<span>kcal</span></div></div>'
      + '<p class="ref-nota">' + esc(r.nota) + '</p>'
      + '<p class="ref-mac" id="m_' + r.id + '">P <b>' + Math.round(s.p) + ' g</b> · C <b>' + Math.round(s.c) + ' g</b> · G <b>' + Math.round(s.g) + ' g</b></p>'
      + '<div class="fixos">' + r.fixos.map(i => '<div class="fx"><span>' + esc(i.nome) + '</span><span class="fq">' + esc(i.qtd) + '</span></div>').join('') + '</div>'
      + '<div class="troca"><div class="troca-l">' + esc(r.troca_rotulo) + '</div>'
      + '<div class="opts">' + r.trocas.map((t,i) =>
          '<button class="opt' + (i===idx?' on':'') + '" data-opt="' + r.id + '" onclick="escolher(\'' + r.id + '\',' + i + ')">' + esc(t.nome) + '</button>').join('') + '</div>'
      + '<p class="opt-det" id="d_' + r.id + '"><b>' + esc(o.nome) + '</b> — ' + esc(o.qtd) + '</p>'
      + '</div></article>';
  });
  h += '<div class="sheet" style="padding-top:16px">'
    + DIETA.notas.map(n => '<div class="block"><h3>' + esc(n.t) + '</h3><p>' + esc(n.d) + '</p></div>').join('') + '</div>';
  document.getElementById('viewDieta').innerHTML = h;
  atualizarTotal();
}

/* ---------- protocolo ---------- */
function renderProto(){
  const p = D.protocolo;
  const aq = '<div class="aq"><span class="h"></span><span class="h">Reps</span><span class="h">Carga</span><span class="h">Descanso</span></div>'
    + p.aquecimento.map(a => '<div class="aq"><span>'+a.serie+'</span><b>'+a.reps+'</b><b>'+a.carga+'</b><span>'+a.desc+'</span></div>').join('');
  const rir = p.rir.map(r => '<div class="rir"><span class="q">'+esc(r.quando)+'</span><span class="a">'+esc(r.o_que)+'</span></div>').join('');
  document.getElementById('viewProto').innerHTML =
      '<div class="sheet"><h2>Protocolo</h2>'
    + '<div class="block"><h3>Faixa de trabalho</h3><p>'+esc(p.reps)+'</p><p>'+esc(p.descanso)+'</p></div>'
    + '<div class="block"><h3>Aquecimento do primeiro exercício</h3>'+aq
    + '<p style="margin-top:10px">A carga alvo é o peso da sua primeira série válida. Depois dos 2 minutos da terceira série, entre na válida.</p></div>'
    + '<div class="block"><h3>Demais exercícios</h3><p>'+esc(p.feeder)+'</p></div>'
    + '<div class="block"><h3>Backoff</h3><p>'+esc(p.backoff)+'</p></div>'
    + '<div class="block"><h3>Cluster</h3><p>'+esc(p.cluster)+'</p></div>'
    + '<div class="block"><h3>Trocar o formato</h3><p>'+esc(p.formato)+'</p></div>'
    + '<div class="block"><h3>Intensidade</h3>'+rir+'</div>'
    + '<div class="tools"><button onclick="exportar()">Exportar backup</button>'
    + '<button onclick="document.getElementById(\'imp\').click()">Importar backup</button></div>'
    + '<input type="file" id="imp" accept=".json" style="display:none">'
    + '<p class="ver">Versão ' + VERSAO + '</p>'
    + '</div>';
  document.getElementById('imp').addEventListener('change', importar);
}
function exportar(){
  const blob = new Blob([JSON.stringify(ler(),null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = 'mgcoach-ppl-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(url);
}
function importar(ev){
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e => {
    try{
      const d = JSON.parse(e.target.result);
      if(confirm('Isso substitui os registros atuais. Continuar?')){ gravar(d); alert('Backup importado.'); abrir('treino'); }
    }catch(err){ alert('Arquivo inválido.'); }
  };
  r.readAsText(f);
}

/* ---------- início ---------- */
(function(){
  formatos = lerFmt();
  plano = lerPlano() || fabrica();
  const hoje = new Date().getDay();
  const doDia = plano.semana.find(d => d.dia === ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][hoje]);
  atual = (doDia && doDia.sessao) || nomesSessoes()[0];
  renderWeek(); renderHead(); renderLista();
  const v = document.getElementById('viewTreino');
  if(!STORAGE_OK){
    const d = document.createElement('div');
    d.className = 'migr';
    d.textContent = 'Este navegador não está salvando dados — provavelmente é uma aba privada. Abra no Safari normal para os registros serem gravados.';
    v.insertBefore(d, v.firstChild);
  } else if(migrados){
    const d = document.createElement('div');
    d.className = 'migr';
    d.textContent = 'Suas cargas foram transferidas para a nova divisão: ' + migrados + ' exercícios reaproveitados. O histórico agora segue o exercício, não o dia.';
    v.insertBefore(d, v.firstChild);
  }
})();
</script>
