<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --paper:#EEF0F2;
  --card:#FFFFFF;
  --rule:#DCE2E7;
  --rule-soft:#EDF0F3;
  --ink:#0C1A26;
  --ink-2:#5A6B78;
  --ink-3:#8E9CA8;
  --accent:#FF5A00;
  --accent-soft:#FFF0E8;
  --r-card:14px;
  --r-field:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Archivo',system-ui,-apple-system,sans-serif;
  font-feature-settings:'tnum' 1;
  line-height:1.5;
  padding-bottom:64px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* ---------- barra superior ---------- */
.bar{
  position:sticky;top:0;z-index:40;
  background:rgba(238,240,242,.92);
  backdrop-filter:saturate(1.6) blur(10px);
  border-bottom:1px solid var(--rule);
}
.bar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;height:52px}
.mark{font-size:13px;font-weight:700;letter-spacing:-.01em}
.mark b{color:var(--accent);font-weight:700}
.linkbtn{
  background:none;border:none;color:var(--ink-2);
  font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;
  padding:6px 2px;border-bottom:1.5px solid transparent;
}
.linkbtn:hover{color:var(--ink)}
.linkbtn.on{color:var(--ink);border-bottom-color:var(--accent)}
.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}

/* ---------- faixa da semana ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:14px 0 18px}
.day{
  background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:8px 2px 9px;text-align:center;cursor:pointer;
  font-family:inherit;color:var(--ink-2);transition:border-color .12s,background .12s;
}
.day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.day .d{font-size:10.5px;font-weight:500;color:var(--ink-3);display:block}
.day .s{font-size:13px;font-weight:700;letter-spacing:-.02em;color:var(--ink);display:block;margin-top:2px}
.day.on{background:var(--ink);border-color:var(--ink)}
.day.on .d{color:rgba(255,255,255,.55)}
.day.on .s{color:#fff}
.day.off{background:transparent;border-style:dashed;cursor:default}
.day.off .s{color:var(--ink-3);font-weight:500}

/* ---------- cabeçalho da sessão ---------- */
.head{padding:4px 0 22px}
.head h1{
  font-size:clamp(34px,10vw,46px);font-weight:700;letter-spacing:-.045em;
  line-height:.98;margin-bottom:10px;
}
.head .foco{font-size:15px;color:var(--ink-2);max-width:40ch;line-height:1.45}
.stats{display:flex;gap:22px;margin-top:16px;padding-top:14px;border-top:1px solid var(--rule)}
.stat .n{font-size:19px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.1}
.stat .l{font-size:11.5px;color:var(--ink-3);font-weight:500}

/* ---------- exercício ---------- */
.ex{
  background:var(--card);border:1px solid var(--rule);border-radius:var(--r-card);
  margin-bottom:9px;overflow:hidden;
}
.ex-top{display:flex;gap:11px;padding:14px 15px 0}
.ex-n{
  font-size:12px;font-weight:600;color:var(--ink-3);
  flex:0 0 auto;width:16px;padding-top:3px;
}
.ex-main{flex:1;min-width:0}
.ex-name{font-size:17px;font-weight:600;letter-spacing:-.025em;line-height:1.2}
.chip{
  display:inline-block;margin-top:6px;
  font-size:11.5px;font-weight:500;color:var(--ink-2);
  background:var(--paper);border:1px solid var(--rule);
  border-radius:999px;padding:2px 9px;
}
.chip.cl{color:var(--accent);background:var(--accent-soft);border-color:#FFD9C4}
.ex-nota{font-size:13px;color:var(--ink-2);line-height:1.48;padding:9px 15px 0 42px}

.prev{padding:11px 15px 0 42px;font-size:13px;color:var(--ink-2)}
.prev .k{color:var(--ink-3);font-weight:500;margin-right:9px;white-space:nowrap}
.prev .v{white-space:nowrap}
.prev b{font-weight:600;color:var(--ink)}
.prev .sep{color:var(--ink-3);margin:0 7px}

/* ---------- grade de registro ---------- */
.log{padding:11px 15px 14px 42px}
.log-h{
  display:grid;grid-template-columns:72px 1fr 1fr;gap:8px;
  font-size:11px;color:var(--ink-3);font-weight:500;padding-bottom:5px;
}
.row{display:grid;grid-template-columns:72px 1fr 1fr;gap:8px;align-items:center;margin-bottom:7px}
.row .lab{font-size:13px;font-weight:500;color:var(--ink-2)}
.row input{
  width:100%;font-family:inherit;font-size:16px;font-weight:600;
  color:var(--ink);background:var(--paper);
  border:1px solid transparent;border-radius:var(--r-field);
  padding:9px 10px;text-align:center;-webkit-appearance:none;appearance:none;

.row input::placeholder{color:var(--ink-3);font-weight:400}
.row input::-webkit-outer-spin-button,.row input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.row input[type=number]{-moz-appearance:textfield}
.row input:focus{outline:none;background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.save{
  width:100%;margin-top:9px;padding:12px;
  background:var(--ink);color:#fff;border:none;border-radius:var(--r-field);
  font-family:inherit;font-size:14.5px;font-weight:600;letter-spacing:-.01em;cursor:pointer;
  transition:background .14s;
}
.save:hover{background:#17293A}
.save:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.save.ok{background:var(--accent)}

.hist-t{
  display:block;width:100%;background:none;border:none;border-top:1px solid var(--rule-soft);
  padding:11px;font-family:inherit;font-size:12.5px;font-weight:500;color:var(--ink-2);cursor:pointer;
}
.hist-t:hover{color:var(--ink)}
.hist{display:none;padding:2px 15px 14px 42px}
.hist.open{display:block}
.hrow{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--rule-soft);font-size:12.5px}
.hrow:last-child{border-bottom:none}
.hrow .hd{color:var(--ink-3);flex:0 0 38px;font-weight:500}
.hrow .hv{flex:1;color:var(--ink)}
.hrow .hx{background:none;border:none;color:var(--ink-3);cursor:pointer;font-size:15px;line-height:1;padding:0 2px;font-family:inherit}
.hrow .hx:hover{color:var(--accent)}

/* ---------- protocolo ---------- */
.sheet{padding:6px 0 10px}
.sheet h2{font-size:26px;font-weight:700;letter-spacing:-.035em;margin-bottom:18px}
.block{background:var(--card);border:1px solid var(--rule);border-radius:var(--r-card);padding:16px 17px;margin-bottom:10px}
.block h3{font-size:15px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px}
.block p{font-size:14px;color:var(--ink-2);line-height:1.55}
.block p + p{margin-top:8px}
.aq{display:grid;grid-template-columns:34px 1fr 1fr 1fr;gap:8px;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--rule-soft)}
.aq:last-child{border-bottom:none}
.aq .h{font-size:11.5px;color:var(--ink-3);font-weight:500}
.aq b{font-weight:600}
.rir{padding:9px 0;border-bottom:1px solid var(--rule-soft);font-size:13.5px}
.rir:last-child{border-bottom:none;padding-bottom:0}
.rir .q{display:block;color:var(--ink-3);font-size:12.5px;margin-bottom:1px}
.rir .a{display:block;font-weight:600;color:var(--ink)}
.tools{display:flex;gap:8px;margin-top:4px}
.tools button{
  flex:1;background:var(--card);border:1px solid var(--rule);border-radius:var(--r-field);
  padding:11px;font-family:inherit;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;
}
.tools button:hover{border-color:var(--ink-3);color:var(--ink)}
.aviso{
  background:var(--accent-soft);border:1px solid #FFD0B4;border-radius:var(--r-card);
  padding:13px 15px;margin:14px 0;font-size:13.5px;color:#8A3200;line-height:1.5;
}
.foot{padding:26px 0 10px;font-size:12.5px;color:var(--ink-3);line-height:1.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    const on = d.sessao === atual && !vendoProto;
    const curto = d.sessao.replace('Upper','U').replace('Lower','L').replace(' ','');
    return '<button class="day'+(on?' on':'')+'" onclick="irPara(\''+d.sessao+'\')" aria-label="'+d.sessao+'">'
         + '<span class="d">'+d.dia+'</span><span class="s">'+curto+'</span></button>';
  }).join('');
}

/* ---------- cabeçalho ---------- */
function renderHead(){
  const s = D.sessoes[atual];
  const nser = s.exs.reduce((a,e)=>a+e.sets.length,0);
  document.getElementById('head').innerHTML =
    '<h1>'+atual+'</h1>'
  + '<p class="foco">'+esc(s.foco)+'</p>'
  + '<div class="stats">'
  + '<div class="stat"><span class="n">'+s.exs.length+'</span><span class="l">exercícios</span></div>'
  + '<div class="stat"><span class="n">'+nser+'</span><span class="l">séries válidas</span></div>'
  + '<div class="stat"><span class="n">5–9</span><span class="l">repetições</span></div>'
  + '</div>';
}

/* ---------- último registro ---------- */
function ultimo(k){
  const h = ler()[k];
  if(!h || !h.length) return '';
  const u = h[h.length-1];
  const txt = u.sets.map(s => '<span class="v"><b>'+(s.carga||'—')+'</b>×<b>'+(s.reps||'—')+'</b></span>').join('<span class="sep">·</span>');
  return '<span class="k">Última '+data(u.data)+'</span>' + txt;
}
function historico(k){
  const h = ler()[k];
  if(!h || !h.length) return '<div class="hrow"><span class="hd">—</span><span class="hv">Nada registrado ainda.</span></div>';
  return h.slice().reverse().map((s,ri) => {
    const real = h.length-1-ri;
    const v = s.sets.map(x => esc(x.lab)+' '+(x.carga||'—')+'kg×'+(x.reps||'—')).join(' · ');
    return '<div class="hrow"><span class="hd">'+data(s.data)+'</span><span class="hv">'+v+'</span>'
         + '<button class="hx" onclick="apagar(\''+k+'\','+real+')" aria-label="Apagar registro">×</button></div>';
  }).join('');
}

/* ---------- lista de exercícios ---------- */
function renderLista(){
  const s = D.sessoes[atual];
  document.getElementById('lista').innerHTML = s.exs.map((e,i) => {
    const k = chave(atual,i);
    const h = ler()[k];
    const prev = (h && h.length) ? h[h.length-1].sets : null;
    const linhas = e.sets.map((lab,j) => {
      const ph = prev && prev[j] && prev[j].carga ? prev[j].carga : '';
      return '<div class="row"><span class="lab">'+esc(lab)+'</span>'
           + '<input type="number" inputmode="decimal" step="0.5" id="'+k+'_c'+j+'" placeholder="'+(ph||'kg')+'" aria-label="Carga série '+esc(lab)+'">'
           + '<input type="number" inputmode="numeric" id="'+k+'_r'+j+'" placeholder="reps" aria-label="Repetições série '+esc(lab)+'"></div>';
    }).join('');
    const chip = '<span class="chip'+(e.tipo==='cluster'?' cl':'')+'">'+esc(e.esquema)+'</span>';
    return '<article class="ex">'
      + '<div class="ex-top"><span class="ex-n">'+(i+1)+'</span>'
      + '<div class="ex-main"><h2 class="ex-name">'+esc(e.nome)+'</h2>'+chip+'</div></div>'
      + (e.nota ? '<p class="ex-nota">'+esc(e.nota)+'</p>' : '')
      + '<p class="prev" id="'+k+'_p"'+(ultimo(k)?'':' hidden')+'>'+ultimo(k)+'</p>'
      + '<div class="log"><div class="log-h"><span>Série</span><span>Carga</span><span>Reps</span></div>'
      + linhas
      + '<button class="save" id="'+k+'_b" onclick="registrar(\''+atual+'\','+i+')">Registrar</button></div>'
      + '<button class="hist-t" onclick="verHist(\''+k+'\')" aria-expanded="false">Histórico</button>'
      + '<div class="hist" id="'+k+'_h">'+historico(k)+'</div>'
      + '</article>';
  }).join('');
}

/* ---------- ações ---------- */
function registrar(sessao, i){
  const e = D.sessoes[sessao].exs[i], k = chave(sessao,i);
  const sets = e.sets.map((lab,j) => ({
    lab: lab,
    carga: document.getElementById(k+'_c'+j).value.trim(),
    reps:  document.getElementById(k+'_r'+j).value.trim()
  }));
  if(sets.every(s => !s.carga && !s.reps)){
    alert('Preencha ao menos uma carga ou repetição antes de registrar.');
    return;
  }
  const reg = ler();
  if(!reg[k]) reg[k] = [];
  reg[k].push({data:new Date().toISOString(), sets:sets});
  if(!gravar(reg)){ alert('Este navegador não está salvando dados. Abra no Safari normal, fora da aba privada.'); return; }
  const b = document.getElementById(k+'_b');
  b.textContent = 'Registrado'; b.classList.add('ok');
  setTimeout(()=>{ b.textContent='Registrar'; b.classList.remove('ok'); }, 1400);
  const pel = document.getElementById(k+'_p');
  pel.innerHTML = ultimo(k); pel.hidden = !ultimo(k);
  document.getElementById(k+'_h').innerHTML = historico(k);
  e.sets.forEach((lab,j) => {
    const ci = document.getElementById(k+'_c'+j);
    ci.placeholder = ci.value.trim() || ci.placeholder;
    ci.value = ''; document.getElementById(k+'_r'+j).value = '';
  });
}
function apagar(k, idx){
  if(!confirm('Apagar este registro?')) return;
  const reg = ler();
  if(!reg[k]) return;
  reg[k].splice(idx,1);
  if(!reg[k].length) delete reg[k];
  gravar(reg);
  document.getElementById(k+'_h').innerHTML = historico(k);
  const p = document.getElementById(k+'_p'); if(p){ p.innerHTML = ultimo(k); p.hidden = !ultimo(k); }
}
function verHist(k){
  const el = document.getElementById(k+'_h');
  el.classList.toggle('open');
  el.previousElementSibling.setAttribute('aria-expanded', el.classList.contains('open'));
}
function irPara(s){
  atual = s; vendoProto = false;
  document.getElementById('viewTreino').style.display = '';
  document.getElementById('viewProto').style.display = 'none';
  document.getElementById('btnProto').classList.remove('on');
  renderWeek(); renderHead(); renderLista();
  window.scrollTo({top:0});
}

/* ---------- protocolo ---------- */
function renderProto(){
  const p = D.protocolo;
  const aq = '<div class="aq"><span class="h"></span><span class="h">Reps</span><span class="h">Carga</span><span class="h">Descanso</span></div>'
    + p.aquecimento.map(a => '<div class="aq"><span>'+a.serie+'</span><b>'+a.reps+'</b><b>'+a.carga+'</b><span>'+a.desc+'</span></div>').join('');
  const rir = p.rir.map(r => '<div class="rir"><span class="q">'+esc(r.quando)+'</span><span class="a">'+esc(r.o_que)+'</span></div>').join('');
  document.getElementById('viewProto').innerHTML =
      '<div class="sheet"><h2>Protocolo</h2>'
    + '<div class="block"><h3>Faixa de trabalho</h3><p>'+esc(p.reps)+'</p><p>'+esc(p.descanso)+'</p></div>'
    + '<div class="block"><h3>Aquecimento do primeiro exercício</h3>'+aq
    + '<p style="margin-top:10px">A carga alvo é o peso da sua primeira série válida. Depois dos 2 minutos da terceira série, entre na válida.</p></div>'
    + '<div class="block"><h3>Demais exercícios</h3><p>'+esc(p.feeder)+'</p></div>'
    + '<div class="block"><h3>Backoff</h3><p>'+esc(p.backoff)+'</p></div>'
    + '<div class="block"><h3>Cluster</h3><p>'+esc(p.cluster)+'</p></div>'
    + '<div class="block"><h3>Intensidade</h3>'+rir+'</div>'
    + '<div class="tools"><button onclick="exportar()">Exportar backup</button>'
    + '<button onclick="document.getElementById(\'imp\').click()">Importar backup</button></div>'
    + '<input type="file" id="imp" accept=".json" style="display:none">'
    + '</div>';
  document.getElementById('imp').addEventListener('change', importar);
}
function verProtocolo(){
  vendoProto = true;
  document.getElementById('viewTreino').style.display = 'none';
  document.getElementById('viewProto').style.display = '';
  document.getElementById('btnProto').classList.add('on');
  renderProto();
  window.scrollTo({top:0});
}
function exportar(){
  const blob = new Blob([JSON.stringify(ler(),null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = 'mgcoach-ul3x-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(url);
}
function importar(ev){
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e => {
    try{
      const d = JSON.parse(e.target.result);
      if(confirm('Isso substitui os registros atuais. Continuar?')){ gravar(d); alert('Backup importado.'); irPara(atual); }
    }catch(err){ alert('Arquivo inválido.'); }
  };
  r.readAsText(f);
}

/* ---------- início ---------- */
(function(){
  const hoje = new Date().getDay();          // 0 dom … 6 sáb
  const mapa = [null,'Upper 1','Lower 1','Upper 2','Lower 2','Upper 3','Lower 3'];
  if(mapa[hoje]) atual = mapa[hoje];
  renderWeek(); renderHead(); renderLista();
  if(!STORAGE_OK){
    const d = document.createElement('div');
    d.className = 'aviso';
    d.textContent = 'Este navegador não está salvando dados — provavelmente é uma aba privada. Abra no Safari normal para os registros serem gravados.';
    const v = document.getElementById('viewTreino');
    v.insertBefore(d, v.firstChild);
  }
})();
</script>
</body>
